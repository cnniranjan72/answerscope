# Runs the engineering test suite on every push and pull request. Needs no private data:
# the supplied pack, recordings-dependent property tests and .env are absent in CI, and the
# suite was verified to pass that way (clean clone without assignment/, 29 Oct 2026).
name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
  docker:
    # Builds the public-safe image, checks it seeds the synthetic demo data, and checks that
    # no private paths (supplied pack, recordings, outputs, evaluation data) are in the image.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t answerscope-demo .
      - name: No private paths in the image
        run: |
          for p in assignment replay outputs evaluation var .env; do
            if docker run --rm answerscope-demo test -e "/srv/$p"; then echo "found /srv/$p"; exit 1; fi
          done
      - name: Smoke test
        run: |
          A=$(python3 -c "import secrets;print(secrets.token_urlsafe(24))")
          docker run -d --name demo -p 8000:8000 -e ANALYST_TOKEN=$A -e REVIEWER_TOKEN=$(python3 -c "import secrets;print(secrets.token_urlsafe(24))") answerscope-demo
          for i in $(seq 1 30); do curl -fs localhost:8000/health && break; sleep 2; done
          curl -fs -H "Authorization: Bearer $A" localhost:8000/analyses | python3 -c "import json,sys; a=json.load(sys.stdin)['analyses']; assert a and a[0]['counts']['succeeded']==6, a; print('seeded', a[0]['counts'])"
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/analyses)" = 401
      - if: failure()
        run: docker logs demo || true
