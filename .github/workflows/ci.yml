# Runs the engineering test suite on every push and pull request. Needs no private data:
# the supplied pack, recordings-dependent property tests and .env are absent in CI, and the
# suite was verified to pass that way (clean clone without assignment/, 29 Oct 2026).
name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
